# --- HTTP / CORS ---
quarkus.http.port=${API_PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=12M
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.exposed-headers=Content-Disposition

# --- Database ---
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:mysql://localhost:3306/warranty_keeper}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:warranty_user}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:change_me}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# --- OpenAPI ---
quarkus.smallrye-openapi.info-title=Warranty Keeper API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# --- Application ---
app.upload-dir=${UPLOAD_DIR:uploads}
app.max-file-size-bytes=10485760
warranty.expiring-soon-days=7

# --- Tests: in-memory H2 (MySQL mode), temp upload dir ---
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:warranty;MODE=MySQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.app.upload-dir=target/test-uploads
%test.quarkus.scheduler.enabled=false

# --- Barcode lookup ---
lookup.external.enabled=${LOOKUP_EXTERNAL_ENABLED:true}
%test.lookup.external.enabled=false
%test.quarkus.http.test-port=0

# --- Auth (single admin account) ---
auth.enabled=true
auth.admin-username=${ADMIN_USERNAME:admin}
auth.admin-password=${ADMIN_PASSWORD:change_me}
auth.secret=${AUTH_SECRET:}
auth.session-hours=12
auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
quarkus.http.cors.access-control-allow-credentials=true
%test.auth.enabled=false
